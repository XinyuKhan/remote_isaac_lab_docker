services:
  webrtc_issaclab_build:
    container_name: webrtc-issaclab-build
    image: xinyukhan/remote_isaaclab_docker:${IMG_VERSION:-latest}
    build:
      context: ../../
      dockerfile: dockerfiles/dev_webrtc.dockerfile
      args:
        - FROM_IMAGE=ghcr.io/selkies-project/nvidia-egl-desktop:22.04-20250629090949
    deploy:
      replicas: 0
  webrtc_gym_build:
    container_name: webrtc-gym-build
    image: xinyukhan/remote_gym_docker:${IMG_VERSION:-latest}
    build:
      context: ../../
      dockerfile: dockerfiles/gym_webrtc.dockerfile
      args:
        - FROM_IMAGE=ghcr.io/selkies-project/nvidia-egl-desktop:22.04-20250629090949
    deploy:
      replicas: 0
  webrtc_playgroud_build:
    container_name: webrtc-playgroud-build
    image: xinyukhan/remote_playgroud_docker:${IMG_VERSION:-latest}
    build:
      context: ../../
      dockerfile: dockerfiles/playgroud_webrtc.dockerfile
      args:
        - FROM_IMAGE=ghcr.io/selkies-project/nvidia-egl-desktop:22.04-20250629090949
    deploy:
      replicas: 0
  webrtc_curobo_build:
    container_name: webrtc-curobo-build
    image: xinyukhan/remote_curobo_docker:${IMG_VERSION:-latest}
    build:
      context: ../../
      dockerfile: dockerfiles/curobo_webrtc.dockerfile
      args:
        - FROM_IMAGE=ghcr.io/selkies-project/nvidia-egl-desktop:22.04-20250629090949
        - CUROBO_CUDA_VARIANT=${CUROBO_CUDA_VARIANT:-cu12-torch}
    deploy:
      replicas: 0
  coturn:
    container_name: gym-coturn
    image: coturn/coturn
    ports:
      - "${COTURN_PORT:-3478}:3478/udp"
      - "${COTURN_PORT:-3478}:3478"
      - "49160-49200:49160-49200/udp"
      - "49160-49200:49160-49200"
    command: >
      -n
      --listening-ip=0.0.0.0
      --realm=${COTURN_HOST}
      --min-port=49160
      --max-port=49200
      --use-auth-secret
      --static-auth-secret=${COTURN_AUTH_SECRET}
    restart: unless-stopped
  webrtc_isaaclab0:
    container_name: webrtc-isaaclab0
    image: xinyukhan/remote_isaaclab_docker:${IMG_VERSION:-latest}
    depends_on:
      - coturn
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    privileged: true
    ipc: host
    pid: host
    tmpfs:
      /dev/shm:rw
    environment:
      TZ: Asia/Shanghai
      DISPLAY_SIZEW: 1920
      DISPLAY_SIZEH: 1080
      DISPLAY_REFRESH: 60
      DISPLAY_DPI: 96
      DISPLAY_CDEPTH: 24
      PASSWD: ${WEBRTC_PASSWORD:-password}
      SELKIES_WEBRTC_ENCODER: nvh264enc
      SELKIES_ENABLE_RESIZE: false
      SELKIES_VIDEO_BITRATE: 2000
      SELKIES_FRAMERATE: 30
      SELKIES_AUDIO_BITRATE: 128000
      SELKIES_ENABLE_BASIC_AUTH: true
      SELKIES_BASIC_AUTH_PASSWORD: ${WEBRTC_PASSWORD:-password}
      SELKIES_ENABLE_HTTPS: true
      SELKIES_TURN_HOST: ${COTURN_HOST}
      SELKIES_TURN_PORT: ${COTURN_PORT:-3478}
      SELKIES_TURN_SHARED_SECRET: ${COTURN_AUTH_SECRET}
      SELKIES_TURN_PROTOCOL: tcp
      SELKIES_TURN_TLS: false
      PROXY_ADDR: ${DOCKER_PROXY_ADDR:-172.17.0.1}
      PROXY_PORT_HTTP: ${DOCKER_PROXY_PORT_HTTP:-10808}
      PROXY_PORT_HTTPS: ${DOCKER_PROXY_PORT_HTTPS:-10808}
      SHELL_AUTO_PROXY: ${SHELL_AUTO_PROXY:-false}
    ports:
      - "8080:8080"
      - "2220:2220"
    volumes:
      - ~/Projects:/home/ubuntu/Projects
    tty: true
    restart: unless-stopped
  webrtc-gym0:
